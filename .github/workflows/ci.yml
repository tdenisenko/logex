name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify vendored crates
        run: python3 tools/verify_datafusion_vendor.py
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
      - name: Install pinned Protobuf compiler
        run: bash tools/setup_ci_protoc.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --all-targets --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Check patched Reth formatting
        run: >-
          rustfmt --check --edition 2024
          --config-path vendor/reth-network/rustfmt.toml
          --config skip_children=true
          vendor/reth-network/src/eth_requests.rs
          vendor/reth-network/src/session/active.rs
          vendor/reth-network/src/session/mod.rs
          vendor/reth-network/src/session/types.rs
          vendor/reth-network/src/session/range_update.rs
          vendor/reth-discv5/src/lib.rs
      - name: Check patched ENR formatting
        run: rustfmt --check --edition 2021 --config skip_children=true vendor/enr/src/lib.rs

      - name: Check patched gossipsub formatting
        run: >-
          rustfmt --check --edition 2021 --config skip_children=true
          vendor/libp2p-gossipsub/src/time_cache.rs
          vendor/libp2p-gossipsub/src/backoff.rs
          vendor/libp2p-gossipsub/src/behaviour.rs
          vendor/libp2p-gossipsub/src/behaviour/tests.rs
          vendor/libp2p-gossipsub/src/subscription_filter.rs
          vendor/libp2p-gossipsub/src/config.rs
          vendor/libp2p-gossipsub/src/error.rs
          vendor/libp2p-gossipsub/src/event_queue.rs
          vendor/libp2p-gossipsub/src/gossip_promises.rs
          vendor/libp2p-gossipsub/src/lib.rs
          vendor/libp2p-gossipsub/src/mcache.rs
          vendor/libp2p-gossipsub/src/peer_score.rs
          vendor/libp2p-gossipsub/src/types.rs
          vendor/libp2p-gossipsub/src/rpc.rs
          vendor/libp2p-gossipsub/src/topic.rs
          vendor/libp2p-gossipsub/src/handler.rs

      - name: Check patched connection-limit formatting
        run: rustfmt --check --edition 2021 --config skip_children=true vendor/libp2p-connection-limits/src/lib.rs

      - name: Check patched aggregate formatting
        run: >-
          rustfmt --check --edition 2021
          --config max_width=90,skip_children=true
          vendor/datafusion-functions-aggregate/src/sum.rs
          vendor/datafusion-functions-aggregate/src/average.rs
          vendor/datafusion-functions-aggregate-common/src/aggregate/sum_distinct/numeric.rs
          vendor/datafusion-functions-aggregate-common/src/aggregate/avg_distinct/decimal.rs
          vendor/datafusion-functions-aggregate-common/src/utils.rs

      - name: Check patched query execution formatting
        run: >-
          rustfmt --check --edition 2021
          --config max_width=90,skip_children=true
          vendor/datafusion-physical-plan/src/sorts/sort.rs

      - name: Check query bitmap formatting
        run: >-
          rustfmt --check --edition 2021 --config skip_children=true
          vendor/roaring/src/bitmap/query_decode.rs
          vendor/roaring/src/bitmap/query_ops.rs

      - name: Check patched gRPC encoding formatting
        run: >-
          rustfmt --check --edition 2021 --config skip_children=true
          vendor/tonic/src/codec/mod.rs
          vendor/tonic/src/codec/buffer.rs
          vendor/tonic/src/codec/encode.rs
          vendor/tonic/src/codec/owned_buffer.rs
          vendor/tonic/src/codec/logex_tests.rs
          vendor/tonic/src/transport/server/io_stream.rs

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
          components: clippy
      - name: Install pinned Protobuf compiler
        run: bash tools/setup_ci_protoc.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check offline dashboard behavior
        run: node --test tools/dashboard-*.test.mjs
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
      - name: Install pinned Protobuf compiler
        run: bash tools/setup_ci_protoc.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - name: Check pinned gRPC encoding ownership
        env:
          CARGO_TARGET_DIR: target/tonic-regressions
        run: |
          cargo test --manifest-path vendor/tonic/Cargo.toml --lib --locked
          cargo test --manifest-path vendor/tonic/Cargo.toml --lib --features gzip --locked
      - name: Check pinned bitmap ownership
        env:
          CARGO_TARGET_DIR: target/roaring-regressions
        run: cargo test --manifest-path vendor/roaring/Cargo.toml --lib logex_ --locked

      - name: Check pinned query execution ownership
        env:
          CARGO_TARGET_DIR: target/physical-plan-regressions
        run: cargo test --manifest-path vendor/datafusion-physical-plan/Cargo.toml --lib logex_internal --locked
      - name: Check pinned gossipsub regressions
        env:
          CARGO_TARGET_DIR: target/gossipsub-regressions
        run: cargo test --manifest-path vendor/libp2p-gossipsub/Cargo.toml --lib logex_ --locked

      - name: Check pinned connection-limit library tests
        env:
          CARGO_TARGET_DIR: target/connection-limits-regressions
        run: |
          cargo test --manifest-path vendor/libp2p-connection-limits/Cargo.toml --lib --locked
          cargo test --manifest-path vendor/libp2p-connection-limits/Cargo.toml --doc --locked

      - name: Verify external-volume lifecycle with disposable Linux images
        run: |
          cargo build -p logex-node --example volume_probe --locked
          python3 tools/test_volume_mounts.py --binary target/debug/examples/volume_probe --report target/volume-mount-results.json

      - name: Retain volume test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-volume-mount-results
          path: target/volume-mount-results.json
          if-no-files-found: warn

  macos-test:
    name: macOS Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check offline dashboard behavior
        run: node --test tools/dashboard-*.test.mjs
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
      - name: Install pinned Protobuf compiler
        run: bash tools/setup_ci_protoc.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - name: Check pinned gRPC encoding ownership
        env:
          CARGO_TARGET_DIR: target/tonic-regressions
        run: |
          cargo test --manifest-path vendor/tonic/Cargo.toml --lib --locked
          cargo test --manifest-path vendor/tonic/Cargo.toml --lib --features gzip --locked
      - name: Check pinned bitmap ownership
        env:
          CARGO_TARGET_DIR: target/roaring-regressions
        run: cargo test --manifest-path vendor/roaring/Cargo.toml --lib logex_ --locked

      - name: Check pinned query execution ownership
        env:
          CARGO_TARGET_DIR: target/physical-plan-regressions
        run: cargo test --manifest-path vendor/datafusion-physical-plan/Cargo.toml --lib logex_internal --locked
      - name: Check pinned gossipsub regressions
        env:
          CARGO_TARGET_DIR: target/gossipsub-regressions
        run: cargo test --manifest-path vendor/libp2p-gossipsub/Cargo.toml --lib logex_ --locked

      - name: Check pinned connection-limit library tests
        env:
          CARGO_TARGET_DIR: target/connection-limits-regressions
        run: |
          cargo test --manifest-path vendor/libp2p-connection-limits/Cargo.toml --lib --locked
          cargo test --manifest-path vendor/libp2p-connection-limits/Cargo.toml --doc --locked

  release:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
      - name: Install pinned Protobuf compiler
        run: bash tools/setup_ci_protoc.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p logex-node --release --locked
