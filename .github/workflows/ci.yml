name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendored crates
        run: python3 tools/verify_datafusion_vendor.py
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Check patched Reth formatting
        run: >-
          rustfmt --check --edition 2024
          --config-path vendor/reth-network/rustfmt.toml
          --config skip_children=true
          vendor/reth-network/src/eth_requests.rs
          vendor/reth-network/src/session/active.rs
          vendor/reth-network/src/session/mod.rs
          vendor/reth-network/src/session/types.rs
          vendor/reth-network/src/session/range_update.rs
          vendor/reth-discv5/src/lib.rs
      - name: Check patched ENR formatting
        run: rustfmt --check --edition 2021 --config skip_children=true vendor/enr/src/lib.rs

      - name: Check patched gossipsub formatting
        run: >-
          rustfmt --check --edition 2021 --config skip_children=true
          vendor/libp2p-gossipsub/src/time_cache.rs
          vendor/libp2p-gossipsub/src/behaviour.rs
          vendor/libp2p-gossipsub/src/behaviour/tests.rs
          vendor/libp2p-gossipsub/src/subscription_filter.rs

      - name: Check patched aggregate formatting
        run: >-
          rustfmt --check --edition 2021
          --config max_width=90,skip_children=true
          vendor/datafusion-functions-aggregate/src/sum.rs
          vendor/datafusion-functions-aggregate/src/average.rs
          vendor/datafusion-functions-aggregate-common/src/aggregate/sum_distinct/numeric.rs
          vendor/datafusion-functions-aggregate-common/src/aggregate/avg_distinct/decimal.rs
          vendor/datafusion-functions-aggregate-common/src/utils.rs

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
          components: clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - name: Check pinned gossipsub regressions
        env:
          CARGO_TARGET_DIR: target/gossipsub-regressions
        run: cargo test --manifest-path vendor/libp2p-gossipsub/Cargo.toml --lib logex_ --locked

      - name: Verify external-volume lifecycle with disposable Linux images
        run: |
          cargo build -p logex-node --example volume_probe --locked
          python3 tools/test_volume_mounts.py --binary target/debug/examples/volume_probe --report target/volume-mount-results.json

      - name: Retain volume test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-volume-mount-results
          path: target/volume-mount-results.json
          if-no-files-found: warn

  macos-test:
    name: macOS Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - name: Check pinned gossipsub regressions
        env:
          CARGO_TARGET_DIR: target/gossipsub-regressions
        run: cargo test --manifest-path vendor/libp2p-gossipsub/Cargo.toml --lib logex_ --locked

  release:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p logex-node --release --locked
