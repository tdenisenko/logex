name: Release packages

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tools/release/**'
      - 'tools/setup_ci_protoc.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE-*'
      - 'INSTALL.md'
      - 'docs/releases/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Cargo version to build (for example 0.1.0); creates a draft release only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  RUSTFLAGS: ''
  CARGO_ENCODED_RUSTFLAGS: ''

jobs:
  prepare:
    name: Release inputs and notices
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
      - name: Validate release inputs
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/master
            test "$GITHUB_REPOSITORY" = tdenisenko/logex
          fi
          python3 tools/release/package.py metadata --version "$REQUESTED_VERSION" --github-output "$GITHUB_OUTPUT"
          python3 -m unittest discover -s tools/release -p 'test_*.py' -v
      - name: Install pinned license tool
        run: |
          tool_dir="$RUNNER_TEMP/logex-cargo-about"
          mkdir "$tool_dir"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz \
            --output "$tool_dir/cargo-about.tar.gz"
          printf '%s  %s\n' 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af "$tool_dir/cargo-about.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/cargo-about.tar.gz" -C "$tool_dir"
          printf '%s\n' "$tool_dir/cargo-about-0.9.2-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Generate complete dependency notices
        run: |
          test "$(cargo-about --version)" = 'cargo-about 0.9.2'
          mkdir -p target/release-notices
          cargo-about generate --locked --fail --manifest-path crates/logex-node/Cargo.toml \
            --config tools/release/about.toml --output-file target/release-notices/THIRD-PARTY-LICENSES.html tools/release/about.hbs
          test -s target/release-notices/THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notices
          path: target/release-notices/THIRD-PARTY-LICENSES.html
          if-no-files-found: error
          retention-days: 30

  build:
    name: Package (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
        with:
          toolchain: nightly-2026-08-24
      - name: Install pinned Protobuf compiler
        run: bash tools/setup_ci_protoc.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notices
          path: target/release-notices
      - name: Verify native target and vendor inputs
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$RELEASE_TARGET"
          python3 tools/verify_datafusion_vendor.py
      - name: Test native release profile
        run: cargo test --workspace --all-targets --release --locked -- --test-threads=4
      - name: Build final executable
        run: |
          cargo build -p logex-node --bin logex --release --locked
          mkdir -p target/release-stage
          cp target/release/logex target/release-stage/logex
      - name: Strip and apply local macOS integrity signature
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            strip -x target/release-stage/logex
            codesign --force --sign - target/release-stage/logex
            codesign --verify --strict target/release-stage/logex
          else
            strip --strip-unneeded target/release-stage/logex
          fi
      - name: Package and smoke-test extracted executable
        run: |
          python3 tools/release/package.py package --version "$RELEASE_VERSION" --target "$RELEASE_TARGET" \
            --binary target/release-stage/logex --licenses target/release-notices/THIRD-PARTY-LICENSES.html \
            --output target/release-assets
      - name: Attest archive built on the default branch
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/release-assets/*.tar.gz
      - name: Retain portable attestation bundle
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" "target/release-assets/logex-v$RELEASE_VERSION-$RELEASE_TARGET.tar.gz.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  assemble:
    name: Verify complete release set
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-package-*
          path: target/release-assets
          merge-multiple: true
      - name: Verify every archive and produce checksums
        shell: bash
        run: |
          extra=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            extra+=(--attestations)
          fi
          python3 tools/release/package.py assemble --version "$RELEASE_VERSION" \
            --directory target/release-assets "${extra[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: target/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  draft:
    name: Create verified draft release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.repository == 'tdenisenko/logex'
    needs: [prepare, assemble]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: target/release-assets
      - name: Require passing exact-commit CI, then create draft
        run: python3 tools/release/publish.py draft --version "$RELEASE_VERSION" --directory target/release-assets
