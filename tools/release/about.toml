# License notices for the four release targets, including build dependencies.
# Keep transitive dependencies; fail generation rather than omit unknown terms.
accepted = [
    "MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "Unlicense",
    "BSL-1.0", "CDLA-Permissive-2.0", "Apache-2.0 WITH LLVM-exception",
]
targets = [
    "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin", "aarch64-apple-darwin",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
workarounds = ["ring", "rustls", "prost", "tonic", "rustix", "bitvec", "chrono", "cocoa"]

[ring]
accepted = ["OpenSSL"]

# Preserve the complete bzip2 and Rust-translation copyright notices.
[libbz2-rs-sys]
accepted = ["bzip2-1.0.6"]
