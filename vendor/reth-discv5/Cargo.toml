# Normalized from exact Reth v1.11.3 commit d6324d63e27ef6b7c49cdc9b1977c1b808234c7b.
# Dependency identities, features and workspace lints are preserved.

[package]
"name" = "reth-discv5"
"version" = "1.11.3"
"edition" = "2024"
"rust-version" = "1.88"
"license" = "MIT OR Apache-2.0"
"homepage" = "https://paradigmxyz.github.io/reth"
"repository" = "https://github.com/paradigmxyz/reth"
"description" = "Ethereum peer discovery V5"

[lints]
"rust" = { "missing_debug_implementations" = "warn", "missing_docs" = "warn", "rust_2018_idioms" = { "level" = "deny", "priority" = -1 }, "unreachable_pub" = "warn", "unused_must_use" = "deny", "rust_2024_incompatible_pat" = "warn" }
"rustdoc" = { "all" = "warn" }
"clippy" = { "borrow_as_ptr" = "warn", "branches_sharing_code" = "warn", "clear_with_drain" = "warn", "cloned_instead_of_copied" = "warn", "collection_is_never_read" = "warn", "dbg_macro" = "warn", "derive_partial_eq_without_eq" = "warn", "doc_markdown" = "warn", "empty_line_after_doc_comments" = "warn", "empty_line_after_outer_attr" = "warn", "enum_glob_use" = "warn", "equatable_if_let" = "warn", "explicit_into_iter_loop" = "warn", "explicit_iter_loop" = "warn", "flat_map_option" = "warn", "from_iter_instead_of_collect" = "warn", "if_not_else" = "warn", "if_then_some_else_none" = "warn", "implicit_clone" = "warn", "imprecise_flops" = "warn", "iter_on_empty_collections" = "warn", "iter_on_single_items" = "warn", "iter_with_drain" = "warn", "iter_without_into_iter" = "warn", "large_stack_frames" = "warn", "manual_assert" = "warn", "manual_clamp" = "warn", "manual_is_variant_and" = "warn", "manual_string_new" = "warn", "match_same_arms" = "warn", "missing-const-for-fn" = "warn", "mutex_integer" = "warn", "naive_bytecount" = "warn", "needless_bitwise_bool" = "warn", "needless_continue" = "warn", "needless_for_each" = "warn", "needless_pass_by_ref_mut" = "warn", "nonstandard_macro_braces" = "warn", "option_as_ref_cloned" = "warn", "or_fun_call" = "warn", "path_buf_push_overwrite" = "warn", "read_zero_byte_vec" = "warn", "result_large_err" = "allow", "redundant_clone" = "warn", "redundant_else" = "warn", "single_char_pattern" = "warn", "string_lit_as_bytes" = "warn", "string_lit_chars_any" = "warn", "suboptimal_flops" = "warn", "suspicious_operation_groupings" = "warn", "trailing_empty_array" = "warn", "trait_duplication_in_bounds" = "warn", "transmute_undefined_repr" = "warn", "trivial_regex" = "warn", "tuple_array_conversions" = "warn", "type_repetition_in_bounds" = "warn", "uninhabited_references" = "warn", "unnecessary_self_imports" = "warn", "unnecessary_struct_initialization" = "warn", "unnested_or_patterns" = "warn", "unused_peekable" = "warn", "unused_rounding" = "warn", "use_self" = "warn", "useless_let_if_seq" = "warn", "while_float" = "warn", "zero_sized_map_values" = "warn", "as_ptr_cast_mut" = "allow", "cognitive_complexity" = "allow", "debug_assert_with_mut_call" = "allow", "fallible_impl_from" = "allow", "future_not_send" = "allow", "needless_collect" = "allow", "non_send_fields_in_send_ty" = "allow", "redundant_pub_crate" = "allow", "significant_drop_in_scrutinee" = "allow", "significant_drop_tightening" = "allow", "too_long_first_doc_paragraph" = "allow" }

[dependencies]
"reth-chainspec" = { "default-features" = false, "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v1.11.3" }
"reth-ethereum-forks" = { "default-features" = false, "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v1.11.3" }
"reth-metrics" = { "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v1.11.3" }
"reth-network-peers" = { "default-features" = false, "features" = ["secp256k1"], "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v1.11.3" }
"alloy-primitives" = { "version" = "1.5.6", "default-features" = false, "features" = ["map-foldhash"] }
"alloy-rlp" = { "version" = "0.3.13", "default-features" = false, "features" = ["core-net"] }
"discv5" = { "version" = "0.10", "features" = ["libp2p"] }
"enr" = { "version" = "0.13", "default-features" = false }
"secp256k1" = { "version" = "0.30", "default-features" = false, "features" = ["global-context", "recovery"] }
"tokio" = { "version" = "1.44.2", "default-features" = false }
"futures" = { "version" = "0.3" }
"rand" = { "version" = "0.9" }
"derive_more" = { "version" = "2", "default-features" = false, "features" = ["full"] }
"tracing" = { "version" = "0.1.0", "default-features" = false, "features" = ["attributes"] }
"thiserror" = { "version" = "2.0.0", "default-features" = false }
"itertools" = { "version" = "0.14", "default-features" = false }
"metrics" = { "version" = "0.24.0" }

[dev-dependencies]
"reth-tracing" = { "default-features" = false, "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v1.11.3" }
"alloy-primitives" = { "version" = "1.5.6", "default-features" = false, "features" = ["map-foldhash", "rand"] }
"tokio" = { "version" = "1.44.2", "default-features" = false, "features" = ["rt-multi-thread"] }
"secp256k1" = { "version" = "0.30", "default-features" = false, "features" = ["global-context", "recovery", "std", "rand"] }
"rand_08" = { "package" = "rand", "version" = "0.8" }
