# Normalized from exact Reth v1.11.3 commit d6324d63e27ef6b7c49cdc9b1977c1b808234c7b.
# Standalone normalization preserves the original git + tag dependency identity.

[package]
"name" = "reth-network"
"version" = "1.11.3"
"edition" = "2024"
"rust-version" = "1.88"
"license" = "MIT OR Apache-2.0"
"homepage" = "https://paradigmxyz.github.io/reth"
"repository" = "https://github.com/paradigmxyz/reth"
"description" = "Ethereum network support"

