"reth-transaction-pool" = { "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v1.11.3" }
"reth-storage-api" = { "default-features" = false, "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v1.11.3" }
