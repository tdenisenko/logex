"reth-network" = { "features" = ["test-utils"], "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v1.11.3" }
"reth-network-p2p" = { "features" = ["test-utils"], "git" = "https://github.com/paradigmxyz/reth.git", "tag" = "v1.11.3" }
