[package]
name = "logex-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Internal
logex-types = { workspace = true }
logex-storage = { workspace = true }
logex-index = { workspace = true }
logex-ingestion = { workspace = true }
logex-server = { workspace = true }

# Ethereum primitives
alloy-primitives = { workspace = true }
alloy-consensus = { workspace = true }
alloy-eips = "1.8"

# Reth networking (lightweight, no EVM)
alloy-chains = "0.2"
reth-eth-wire = { workspace = true }
reth-eth-wire-types = { workspace = true }
reth-ecies = { workspace = true }
reth-discv4 = { workspace = true }
reth-network-peers = { workspace = true }
reth-ethereum-forks = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-ethereum-primitives = { workspace = true }

# Async
tokio = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }

# Utilities
tracing = { workspace = true }
eyre = { workspace = true }
thiserror = { workspace = true }
rand = "0.8"
secp256k1 = { version = "0.30", features = ["global-context", "rand"] }

[dev-dependencies]
tempfile = "3"
