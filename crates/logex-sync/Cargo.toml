[package]
name = "logex-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Internal
logex-types = { workspace = true }
logex-cl = { workspace = true }
logex-storage = { workspace = true }
logex-index = { workspace = true }
logex-server = { workspace = true }

# Ethereum primitives
alloy-primitives = { workspace = true }
alloy-consensus = { workspace = true }
alloy-eips = "1.8"
alloy-rlp = "0.3"

# Reth networking (lightweight, no EVM)
reth-eth-wire = { workspace = true }
reth-discv4 = { workspace = true }
reth-dns-discovery = { workspace = true }
reth-network = { workspace = true }
reth-network-peers = { workspace = true }
reth-chainspec = { workspace = true }
reth-ethereum-forks = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-ethereum-primitives = { workspace = true }
reth-storage-api = { workspace = true }
reth-db-models = { workspace = true }
reth-consensus = { workspace = true }
reth-ethereum-consensus = { workspace = true }

# Async
tokio = { workspace = true }
tokio-stream = "0.1"
futures = { workspace = true }
futures-util = { workspace = true }

# Utilities
tracing = { workspace = true }
eyre = { workspace = true }
serde_json = { workspace = true }
rand = "0.8"
secp256k1 = { version = "0.30", features = ["global-context", "rand"] }

[dev-dependencies]
tempfile = "3"
