[workspace]
members = ["crates/logex-types", "crates/logex-cl", "crates/logex-storage", "crates/logex-index", "crates/logex-query", "crates/logex-server", "crates/logex-node", "crates/logex-sync"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdenisenko/logex"

[workspace.dependencies]
# Ethereum primitives
alloy-primitives = "1.5"
alloy-consensus = "1.8"
alloy-rpc-types = "1.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# Async utilities
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
eyre = "0.6"
datafusion = "51"
discv5 = "0.10.4"
libp2p = { version = "0.56.0", default-features = false, features = ["dns", "gossipsub", "identify", "macros", "noise", "quic", "request-response", "tcp", "tokio", "yamux"] }
libp2p-mplex = "0.43.1"
sha2 = "0.10"

# CLI
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime / HTTP / gRPC
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.13"
prost = "0.13"

# Reth networking (lightweight, no EVM dependency)
reth-eth-wire = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }
reth-discv4 = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }
reth-dns-discovery = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }
reth-network = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3", features = ["secp256k1"] }
reth-ethereum-forks = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }
reth-db-models = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }
reth-consensus = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.11.3" }

# Internal crates
logex-types = { path = "crates/logex-types" }
logex-cl = { path = "crates/logex-cl" }
logex-storage = { path = "crates/logex-storage" }
logex-index = { path = "crates/logex-index" }
logex-query = { path = "crates/logex-query" }
logex-server = { path = "crates/logex-server" }
logex-sync = { path = "crates/logex-sync" }
logex-node = { path = "crates/logex-node" }
