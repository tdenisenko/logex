[workspace]
members = ["crates/logex-types", "crates/logex-storage", "crates/logex-index", "crates/logex-ingestion", "crates/logex-node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdenisenko/logex"

[workspace.dependencies]
# Ethereum primitives
alloy-primitives = "1.5"
alloy-consensus = "1.8"
alloy-rpc-types = "1.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
logex-types = { path = "crates/logex-types" }
logex-storage = { path = "crates/logex-storage" }
logex-index = { path = "crates/logex-index" }
logex-ingestion = { path = "crates/logex-ingestion" }
logex-node = { path = "crates/logex-node" }
