[workspace]
members = ["crates/logex-types", "crates/logex-storage", "crates/logex-index", "crates/logex-ingestion", "crates/logex-query", "crates/logex-server", "crates/logex-node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdenisenko/logex"

[workspace.dependencies]
# Ethereum primitives
alloy-primitives = "1.5"
alloy-consensus = "1.8"
alloy-rpc-types = "1.8"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime / HTTP / gRPC
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tonic = "0.13"
prost = "0.13"

# Ethereum RPC
alloy-provider = { version = "1.8", default-features = false, features = ["reqwest"] }
alloy-eips = "1.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

# Internal crates
logex-types = { path = "crates/logex-types" }
logex-storage = { path = "crates/logex-storage" }
logex-index = { path = "crates/logex-index" }
logex-ingestion = { path = "crates/logex-ingestion" }
logex-query = { path = "crates/logex-query" }
logex-server = { path = "crates/logex-server" }
logex-node = { path = "crates/logex-node" }
